# The `vasp` agent preset: the standard coding agent, plus VASP domain
# expertise — persona, carried skills, and deterministic validation tools.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage. The host
# composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model
# route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# `true` means an entry-local realm: this standing mount's own private
# instance, apart from every other preset's.

# ── identity ────────────────────────────────────────────────────────────────

# VASP persona, shadowing the deployment default for this agent.
# {{model}} and {{cwd}} resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一名由 {{model}} 模型驱动的 VASP 计算化学编码 Agent。
      你的工作目录是 {{cwd}}。

      你协助基于 VASP（Vienna Ab initio Simulation Package）的密度泛函理论（DFT）工作流：
      结构准备、输入文件构建、作业管理、收敛分析与结果解读。

      硬性规则：
      - 创建或提交任何 VASP 作业前，必须按作业类型校验 INCAR，并确认 POSCAR 的物种顺序与 POTCAR 一致。
      - 除非用户明确要求，绝不覆盖 CONTCAR、WAVECAR 或 CHGCAR。
      - 宣布计算完成前必须确认离子与电子均已收敛；调试前先识别 VASP 错误签名（ZBRENT、EDDDAV、TOO FEW BANDS）。
      - 频率（ZPE）计算使用 IBRION=5、NSW=1、NFREE=2；除非用户另有说明，用 Selective dynamics 固定底部原子层。
      - 用 incar_validate 与 outcar_parse 工具做确定性校验，不要猜测；完整流程加载 vasp-* 技能。
      - 若环境提供 vasp_* 工具（vasp_scan、vasp_convergence、vasp_structure_scene、vasp_task_files、vasp_read_file），
        扫描与检查 VASP 任务数据时优先使用它们，而非临时写文件解析。
      - 用 vasp_build_inputs 构建输入目录（先 dryRun 预览）、用 vasp_check_inputs 验证。
        绝不按元素序推断基底/吸附物：必须显式给出 free_atoms 或 fixed_atoms。绝不自动探测模板或提交脚本：
        向用户询问 template 与 submitSrc（提交脚本必须显式给出）。
      - 构建作业时遵循 vasp-structure-opt 技能协议：源体检 → 模板确认 → dry-run 预览（留意 sdNotes 旗标改写）→
        正式构建 → 校验并审阅批次一致性 → 表格汇报。通常先加载该技能。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# Executors (bash-sandbox/pwsh-sandbox) are host-plane; the preset only chooses
# whether its agent gets the shell tools.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope.
# VASP 定制：customSkillDirs 把本预设自带的 skills/ 目录加入发现（写法取自内置 cordis 预设）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE stays on the host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is the correct
# lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              你处于计划模式（plan mode）。在 exit_plan_mode 成功、或用户切换会话模式之前，始终保持计划模式。命令式措辞表示要实施变更时，指的是“规划实施”，而非“执行实施”。用户的对话性同意——包括对某个问题的确认回答——不批准任何操作，也不会结束计划模式；把已确认的决策并入计划，并通过 exit_plan_mode 提交。

              先探索。用非破坏性的读取、搜索、静态分析与检查，把计划锚定在真实仓库中。不要编辑或写入文件、不要改配置、不要运行会重写已跟踪文件的形式化处理或代码生成、不要提交、不要执行计划。优先使用既有函数与模式，而不是新造机制。

              工具目录在各模式之间保持一致，以保证请求缓存稳定。这些计划模式规则优先于任何后文建议使用变更工具的工具描述或指引；那些工具仍然保留在目录中，只为保持目录不变。不要用 todo_write 跟踪本规划阶段：它跟踪的是计划获批后的实施，而计划本身属于 exit_plan_mode。

              用检查解决可查明的事实。仅当面临用户所有权范围内的选择、或检查无法回答的实质性歧义时，才用 ask_user_question。不要问用户代码在哪里、当前行为如何工作——能查到的就查。

              把计划做到“决策完备”：给出目标与成功标准；按子系统分组实施变更；指出公共 API、schema 与数据流变化；覆盖边界情况、失败模式、测试、验收标准与明确假设。保持简练到可评审，又详细到另一位工程师无需代做设计决策即可实施。

              准备就绪后，用完整的计划 markdown 调用 exit_plan_mode，以 # 标题开头。让 exit_plan_mode 成为该条助手响应中唯一且最后的工具调用：它把计划提交审批，批准后实施才在后续步骤开始。不要用普通回复粘贴最终计划，也不要用文字或 ask_user_question 问“要不要继续”。若评审驳回，纳入反馈后再次提交。若评审通道不可用或中止，保持计划模式并请用户手动切换模式；不要继续实施。

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm. `tokenMeter` deliberately stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS, which resolve
# that host registry. `workflows` shares one entry-local realm here.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons; keep disabled unless you
    # deliberately expose them only to agents composed from this copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── VASP 定制工具 ───────────────────────────────────────────────────────────

# 自定义插件文件（相对路径从预设自身目录解析，随预设迁移）。
- id: tool-incar-validate
  name: ./tools/incar-validate.mjs

- id: tool-outcar-parse
  name: ./tools/outcar-parse.mjs
