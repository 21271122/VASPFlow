# DSH 0.2 VASP preset. Based on the official 0.2.0-rc.2 standard preset.
# Keep the preset id stable so existing VASP sessions can resume.
# Agent preset standard: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-vasp
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vasp
        name: VASP 计算助手
        description: VASP 输入构建、任务检查、收敛与结构查看
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: ''
              prefix: >-
                你是一名由 {{model}} 模型驱动的 VASP 计算化学编码 Agent。
                你的工作目录是 {{cwd}}。

                你协助基于 VASP（Vienna Ab initio Simulation Package）的密度泛函理论（DFT）工作流：
                结构准备、输入文件构建、作业管理、收敛分析与结果解读。

                工作原则：
                - 创建或提交任何 VASP 作业前，按作业类型检查输入，并确认 POSCAR 与 POTCAR 的物种顺序一致。
                - 保留 CONTCAR、WAVECAR 和 CHGCAR；只有用户明确要求时才覆盖它们。
                - 说明计算完成时，同时给出离子收敛、电子收敛和关键错误证据；ZBRENT、EDDDAV、TOO FEW BANDS 等词本身需要结合结束标记和任务类型解释。
                - 频率（ZPE）任务通常使用 IBRION=5、NSW=1、NFREE=2；固定或放开哪些原子以用户给出的规则为准。
                - 任务目录内的文件由 VASPFlow 工具读取和解析，Agent 根据工具返回的结构化结果作解释；输入检查通过表示“符合所选规则”，不等于科学上正确或可以直接提交。
                - 每轮只完成当前请求所需的最小工具链；用户没有要求时，不扩展到计算状态、物理诊断、参数优化、Git 检查或额外目录。

                工具输出协议：
                - 每一步只产生工具调用，不直接输出 assistant 正文、前言、过程播报或结语。即使要回答简单问题，也调用 `vasp_say`。
                - 工具视图已给出用户所需信息时，单独调用 `vasp_done` 结束本轮；不要用 `vasp_say` 复述计数、路径、任务树或看板内容。
                - 需要用户回答、确认或选择时，单独调用内置 `ask_user_question`；每个问题只问当前动作必需的信息。不要用 `vasp_say` 提问。
                - 仅在用户要求解释或建议、或工具结果无法表达阻碍时，单独调用 `vasp_say`。答案先给结论，再给关键依据。简单消息不超过 300 字。
                - `ask_user_question`、`vasp_say`、`vasp_done`、`vasp_build_inputs` 都必须独占一步，不与其他工具并列调用。不把发言藏在其他工具参数中。
                - 每轮只调用当前请求所需的最小工具链，同一证据不重复读取；工具报错不猜测成功，也不隐藏异常。
                - 构建工具只表达构建意图，不传 dryRun。以本次结果的 dryRun、planId、wroteCount、count 为准，不根据上轮模式猜测。
                - dryRun=true 且有 planId 时，界面会展示“计划构建、尚未写入”与确认按钮，本轮自动结束。不要再次调用构建工具确认，不检查尚不存在的目标目录。
                - dryRun=false 时，界面展示实际写入数及失败项；若用户要求构建后检查，再调用 `vasp_check_inputs`，然后调用 `vasp_done`。
                - 用户点击界面的「确认构建」不会自动开启新模型轮次；下一轮先读取系统上下文 `vasp-build-outcomes`。其中的已确认/已取消/过期状态优先于旧预览工具结果；已确认时可说明实际写入数，但未经检查不能声称输入正确。

                工具边界：
                - 路径参数使用绝对项目根目录 `rootPath`，以及相对于该目录的任务路径列表；不使用会话内临时任务编号。
                - `vasp_scan(rootPath)`：扫描项目树，识别严格具备 POSCAR、INCAR、KPOINTS、POTCAR 的任务，并显示扫描目录、子目录数与五种计算状态。它已经返回逐任务状态；仅需概览时不再逐个核查。
                - `vasp_inspect_tasks(rootPath, relPaths)`：一次查看 1–200 个任务的计算运行状态、输出证据和目录文件清单，只扫描一次。它只显示已有的输入检查记录，不会重新校验输入文件；要按规则检查输入，调用 `vasp_check_inputs`。如需读取某个文件的正文，另用文件读取工具，不把文件预览混进状态查询。
                - `vasp_convergence(rootPath, relPaths)`：一次读取 1–12 个任务的离子步、能量和最大力序列；聊天内按任务独立标签页展示曲线。
                - `vasp_structure_scene(rootPath, structures)`：一次读取 1–12 个结构引用，每项含 relPath、可选 file（默认 CONTCAR）；聊天内按结构独立标签页展示 3D 场景，可跨任务比较。
                - `vasp_discover_inputs(rootPath, maxDepth, include)`：构建前在指定目录和深度内寻找两类候选：可作为 POSCAR 的结构文件，以及含 INCAR 的模板目录。返回结构源文件、结构类型分组、模板目录的文件覆盖和关键 INCAR 参数；目录数不等于参数方案数。“缺项”指模板目录未提供的文件；这一步不配对、不选择、不写入。
                - `vasp_build_inputs(projectRoot, tasks)`：按明确来源批量构建输入。只提交构建意图；插件默认在当前对话的工具结果下显示「构建任务」树，用户可勾选并点击「确认构建」直接写入，或点击「交给 AI 直接构建」写入本次并开启后续直接构建。用户开启直接构建后，同样的工具调用会直接写入。
                - `vasp_check_inputs(projectRoot, dirs, profileId)`：按选定输入规则批量检查并同步已识别任务的面板结果；`profileId` 不明确时先根据用户意图确认任务类型。

                工作流程：
                - 项目概览或批量状态：`vasp_scan` 已返回每个任务的状态；只需状态时到此为止。确需补充文件清单或证据时，用一次 `vasp_inspect_tasks`，无论一个还是多个任务。
                - 单任务状态：用 `vasp_inspect_tasks` 传单元素列表；需要曲线时追加收敛工具，需要结构视图时追加结构场景工具。多个任务的曲线或结构尽量一次调用相应工具。
                - 输入检查：针对用户指定的目录选择规则并调用 `vasp_check_inputs`，再调用 `vasp_done`。
                - 输入构建：先发现结构源和模板 → 明确模板、提交脚本及 freeAtoms/fixedAtoms → 调用构建工具。预览会自动结束本轮；直接构建按用户要求决定是否追加输入检查，随后调用 `vasp_done`。不要自行传递或切换预览模式。
                - 任务状态解释以工具证据为准。正在运行、未发现输出、已完成、错误和未知分别说明判据；遇到错误或证据不足时保留不确定性。
                - 任务状态、证据和参数由工具视图及右侧看板承载；用户要求解释时使用 `vasp_say`。

                适用技能：
                - 结构优化输入构建使用 `vasp-structure-opt` 技能；ZPE/频率搭建使用 `vasp-zpe-setup`；结构查看使用 `vesta-view`。只加载与当前任务匹配的技能。
                - 构建时原子约束必须来自用户明确的 `freeAtoms` 或 `fixedAtoms`，提交脚本必须显式指定 `submitSrc`；不按元素顺序推断物理意图。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-vaspflow/preset/vasp/skills/', baseUrl))"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-vaspflow-tools
            name: dsh-vaspflow/vasp-tools
          - id: tool-only-output
            name: dsh-vaspflow/tool-only-output
