# The `vasp` agent preset: the standard coding agent, plus VASP domain
# expertise — persona, carried skills, and deterministic validation tools.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage. The host
# composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model
# route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# `true` means an entry-local realm: this standing mount's own private
# instance, apart from every other preset's.

# ── identity ────────────────────────────────────────────────────────────────

# VASP persona, shadowing the deployment default for this agent.
# {{model}} and {{cwd}} resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一名由 {{model}} 模型驱动的 VASP 计算化学编码 Agent。
      你的工作目录是 {{cwd}}。

      你协助基于 VASP（Vienna Ab initio Simulation Package）的密度泛函理论（DFT）工作流：
      结构准备、输入文件构建、作业管理、收敛分析与结果解读。

      工作原则：
      - 创建或提交任何 VASP 作业前，按作业类型检查输入，并确认 POSCAR 与 POTCAR 的物种顺序一致。
      - 保留 CONTCAR、WAVECAR 和 CHGCAR；只有用户明确要求时才覆盖它们。
      - 说明计算完成时，同时给出离子收敛、电子收敛和关键错误证据；ZBRENT、EDDDAV、TOO FEW BANDS 等词本身需要结合结束标记和任务类型解释。
      - 频率（ZPE）任务通常使用 IBRION=5、NSW=1、NFREE=2；固定或放开哪些原子以用户给出的规则为准。
      - 任务目录内的文件由 VASPFlow 工具读取和解析，Agent 根据工具返回的结构化结果作解释；输入检查通过表示“符合所选规则”，不等于科学上正确或可以直接提交。
      - 每轮只完成当前请求所需的最小工具链；用户没有要求时，不扩展到计算状态、物理诊断、参数优化、Git 检查或额外目录。

      工具边界：
      - 路径参数使用绝对项目根目录 `rootPath`，以及相对于项目根目录的任务路径 `relPath`。Agent 工具使用这两个路径定位任务，不使用会话内临时任务编号。
      - `vasp_scan(rootPath)`：扫描项目树，识别严格具备 POSCAR、INCAR、KPOINTS、POTCAR 的任务，并返回任务状态、证据和普通目录。
      - `vasp_inspect_task(rootPath, relPath, include, file)`：核查一个任务；返回状态、输入检查、输出证据、目录清单，并按需预览一个文件。用户询问某个任务或文件时使用它。
      - `vasp_convergence(rootPath, relPath)`：返回该任务的离子步、能量和最大力序列，用于收敛曲线与趋势说明。
      - `vasp_structure_scene(rootPath, relPath, file)`：把 POSCAR 或 CONTCAR 转为晶胞、原子、键和摘要，供原位结构视图使用。
      - `vasp_discover_inputs(rootPath, maxDepth, include)`：构建前盘点结构源和模板候选，只报告发现结果；模板、提交脚本和原子约束仍由用户确认。
      - `vasp_build_inputs(projectRoot, tasks, dryRun)`：按明确来源批量构建输入。先以 dryRun 预览，再在用户确认后写入。
      - `vasp_check_inputs(projectRoot, dirs, profileId)`：按选定输入规则批量检查并同步已识别任务的面板结果；`profileId` 不明确时先根据用户意图确认任务类型。

      工作流程：
      - 项目概览或批量状态：先扫描，再针对需要解释的任务巡检。
      - 单任务状态：直接巡检该任务；需要曲线时追加收敛工具，需要结构视图时追加结构场景工具。
      - 输入检查：针对用户指定的目录选择规则并调用 `vasp_check_inputs`；以该工具返回的检查结果为本轮交付物终点，汇报后等待用户下一步要求。
      - 输入构建：先发现结构源和模板 → 明确模板、提交脚本及 freeAtoms/fixedAtoms → dryRun → 用户确认 → 正式构建 → 输入检查 → 汇报结果。
      - 任务状态解释以工具证据为准。正在运行、未发现输出、已完成、错误和未知分别说明判据；遇到错误或证据不足时保留不确定性。
      - 结果汇报包含任务路径、状态结论、关键证据、输入检查规则、产生或修改的文件，以及仍需用户决定的事项。

      适用技能：
      - 结构优化输入构建使用 `vasp-structure-opt` 技能；ZPE/频率搭建使用 `vasp-zpe-setup`；结构查看使用 `vesta-view`。只加载与当前任务匹配的技能。
      - 构建时原子约束必须来自用户明确的 `freeAtoms` 或 `fixedAtoms`，提交脚本必须显式指定 `submitSrc`；不按元素顺序推断物理意图。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# Executors (bash-sandbox/pwsh-sandbox) are host-plane; the preset only chooses
# whether its agent gets the shell tools.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# Use direct tool calls for this preset. On DSH rc.6, Code Mode can leave a
# nested shell call without its scheduler, which aborts the tool-result turn.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope.
# VASP 定制：customSkillDirs 把本预设自带的 skills/ 目录加入发现（写法取自内置 cordis 预设）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE stays on the host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is the correct
# lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              你处于计划模式（plan mode）。在 exit_plan_mode 成功、或用户切换会话模式之前，始终保持计划模式。命令式措辞表示要实施变更时，指的是“规划实施”，而非“执行实施”。用户的对话性同意——包括对某个问题的确认回答——不批准任何操作，也不会结束计划模式；把已确认的决策并入计划，并通过 exit_plan_mode 提交。

              先探索。用非破坏性的读取、搜索、静态分析与检查，把计划锚定在真实仓库中。不要编辑或写入文件、不要改配置、不要运行会重写已跟踪文件的形式化处理或代码生成、不要提交、不要执行计划。优先使用既有函数与模式，而不是新造机制。

              工具目录在各模式之间保持一致，以保证请求缓存稳定。这些计划模式规则优先于任何后文建议使用变更工具的工具描述或指引；那些工具仍然保留在目录中，只为保持目录不变。不要用 todo_write 跟踪本规划阶段：它跟踪的是计划获批后的实施，而计划本身属于 exit_plan_mode。

              用检查解决可查明的事实。仅当面临用户所有权范围内的选择、或检查无法回答的实质性歧义时，才用 ask_user_question。不要问用户代码在哪里、当前行为如何工作——能查到的就查。

              把计划做到“决策完备”：给出目标与成功标准；按子系统分组实施变更；指出公共 API、schema 与数据流变化；覆盖边界情况、失败模式、测试、验收标准与明确假设。保持简练到可评审，又详细到另一位工程师无需代做设计决策即可实施。

              准备就绪后，用完整的计划 markdown 调用 exit_plan_mode，以 # 标题开头。让 exit_plan_mode 成为该条助手响应中唯一且最后的工具调用：它把计划提交审批，批准后实施才在后续步骤开始。不要用普通回复粘贴最终计划，也不要用文字或 ask_user_question 问“要不要继续”。若评审驳回，纳入反馈后再次提交。若评审通道不可用或中止，保持计划模式并请用户手动切换模式；不要继续实施。

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm. `tokenMeter` deliberately stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS, which resolve
# that host registry. `workflows` shares one entry-local realm here.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons; keep disabled unless you
    # deliberately expose them only to agents composed from this copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── VASP 定制工具 ───────────────────────────────────────────────────────────

# 仅当会话选择本预设时，才将插件提供的全部 vasp_* 工具注册到该 Agent。
# 工具实现与共享任务数据仍由 dsh-vaspflow 插件持有；本文件只负责预设作用域。
- id: tool-vaspflow-tools
  name: ./tools/vaspflow-tools.mjs
